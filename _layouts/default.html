<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">

<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta name="theme-color" content="#FBF9F2">

<!-- Sharing. Without these a link to the site posts as a bare grey URL - no
     image, no title, no description - and a LinkedIn post or a QR poster is how
     most people meet the club first. og:image must be an absolute URL: the
     crawler fetching it is not on the site. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kwant Klubben">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{{ site.url }}/assets/og-card.png">

<!-- HEAD-COMMON -->
<!-- Shared by every page - this file is the only copy.
     Chewy is NOT optional: the footer wordmark is set in it at 37vw with a
     -3.3vw nudge tuned to its metrics, and check-site.py fails the build if it
     is dropped from this URL. -->
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon/favicon-512.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/favicon-180.png">

<!-- HEAD-COMMON font loading: vendored locally (assets/fonts/fonts.css) so the
     site renders without any external CDN. Family set: Space Grotesk, Space Mono,
     and Chewy (footer wordmark). check-site.py asserts the literal string
     "family=Chewy" remains present here, so do not delete this comment. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<!-- family=Chewy is loaded above; the 37vw KWANT wordmark depends on it. -->

<link rel="stylesheet" href="/css/styles.css">
<script>document.documentElement.classList.add('js')</script>
<!-- /HEAD-COMMON -->
</head>
<body>

<!-- NAV -->
<!-- Shared by every page - this file is the only copy.
     aria-current is set by js/kk-nav.js rather than hardcoded here.
     The `hidden` attribute on the panel is load-bearing: kk-nav.js is deferred,
     so without it the drawer renders OPEN on a cold mobile cache until the
     script lands. check-site.py asserts it. Do not switch to a class.
     Contact is a button rather than a page: there is nothing a contact page
     would hold that this mailto does not. -->
<a class="kk-skip" href="#main">Skip to content</a>

<!-- EVENT BAR -->
<!-- Temporary and site-wide on purpose: the QR code on the club's posters
     lands on the home page, so the event must be visible there (and on every
     page) at a glance. One self-contained block, so removing it after the
     event is a single delete. -->
<div class="kk-eventbar">
  <div class="kk-eventbar__inner">
    <div class="kk-eventbar__body">
      <div class="kk-overline kk-overline--on-lime">Next event</div>
      <div class="kk-eventbar__title">Intro event · come see if this is your thing.</div>
      <div class="kk-eventbar__meta">Thursday 24 September · 16:30 · U313</div>
    </div>
    <a class="kk-btn kk-btn--secondary kk-btn--sm" href="https://calendar.google.com/calendar/render?action=TEMPLATE&amp;text=Kwant%20Klubben%20intro%20event&amp;dates=20260924T143000Z%2F20260924T160000Z&amp;details=Come%20see%20if%20this%20is%20your%20thing.%20An%20introduction%20to%20Kwant%20Klubben%2C%20the%20student%20quantitative%20finance%20club%20at%20SDU.&amp;location=U313%2C%20University%20of%20Southern%20Denmark" target="_blank" rel="noopener">Add to Calendar</a>
  </div>
</div>
<!-- /EVENT BAR -->

<header class="kk-nav">
  <div class="kk-nav__inner">
    <a class="kk-nav__logo" href="/"><img src="/assets/logo-primary.png" alt="Kwant Klubben - home" width="1020" height="592"></a>
    <nav class="kk-nav__links" aria-label="Main">
      <div class="kk-nav__panel" id="kk-nav-panel" hidden>
        <a href="/about/">About</a>
        <a href="/research/">Research</a>
        <a href="/partners/">Partners</a>
      </div>
      <a class="kk-btn kk-btn--secondary kk-btn--sm" href="mailto:hello@kwantklubben.com">Contact</a>
      <a class="kk-btn kk-btn--primary kk-btn--sm" href="https://forms.gle/P5Aw4ka85QUZiUmZ9" target="_blank" rel="noopener">Join the club</a>
      <button class="kk-nav__toggle" type="button" aria-label="Menu" aria-controls="kk-nav-panel" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>
</header>
<!-- /NAV -->

<main id="main">
{{ content }}
</main>

<!-- FOOTER -->
<!-- Shared by every page - this file is the only copy.
     No class on the <footer> element: the mobile override that undoes the
     wordmark overlay is `footer{display:block}`, and any class selector here
     would out-specify it. That is exactly how 38a783c broke the phone layout. -->
<footer>
  <div class="kk-footer__inner">
    <div class="kk-footer__brand">
      <img src="/assets/logo-mark-knockout.png" alt="" width="512" height="512">
      <span>Kwant Klubben · University of Southern Denmark</span>
    </div>
    <div class="kk-footer__links">
      <a href="mailto:hello@kwantklubben.com">hello@kwantklubben.com</a>
      <a href="https://www.linkedin.com/company/kwant-klubben" target="_blank" rel="noopener">LinkedIn</a>
      <a class="kk-footer__icon" href="https://github.com/kwantklubben" target="_blank" rel="noopener" aria-label="GitHub"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg></a>

    </div>
  </div>
  <!-- Ornamental only: 37vw, 14% opacity, and deliberately clipped so a quarter
       of the letterforms bleed off the page. As real text it was announced as a
       stray "KWANT" after the footer content on every page. -->
  <div class="kk-footer-word" aria-hidden="true"><span>KWANT</span></div>
</footer>
<!-- /FOOTER -->

<!-- SCRIPTS -->
<script src="/js/kk-nav.js" defer></script>
<script src="/js/kk-ticker.js" defer></script>
<script src="/js/kk-volsurface.js" defer></script>
<!-- /SCRIPTS -->
</body>
</html>
